        required: false
      - { label: "Google Map URL", name: "google_map_url", widget: "string", required: false, hint: "Google Maps embed or link URL" }
      - { label: "Agent Name", name: "agent_name", widget: "string", default: "Rajesh Kumar" }
      - { label: "Agent Phone", name: "agent_phone", widget: "string", default: "+91 98765 43210" }
      - { label: "Agent Email", name: "agent_email", widget: "string", default: "rajesh@premierproperties.in" }
      - { label: "Published Date", name: "published_date", widget: "datetime" }
      - label: "Features"
        name: "features"
        widget: "select"
        multiple: true
        required: false
        options:
          - { label: "Near School", value: "near_school" }
          - { label: "Near Hospital", value: "near_hospital" }
          - { label: "Near Highway", value: "near_highway" }
          - { label: "Near Bus Stand", value: "near_bus_stand" }
          - { label: "Near Railway Station", value: "near_railway_station" }
          - { label: "Near Airport", value: "near_airport" }
          - { label: "Gated Community", value: "gated_community" }
          - { label: "Park Facing", value: "park_facing" }
          - { label: "Corner Property", value: "corner_property" }

      - { label: "Shop Area (sq.ft)", name: "shop_area_sqft", widget: "number", value_type: "int" }
      - { label: "Frontage Width (ft)", name: "frontage_width", widget: "number", value_type: "float", required: false }
      - { label: "Floor Number", name: "floor_number", widget: "number", value_type: "int", default: 0 }
      - { label: "Parking Spaces", name: "parking_spaces", widget: "number", value_type: "int", default: 0 }
      - { label: "Storage Room", name: "storage_room", widget: "boolean", default: false }
      - { label: "Washroom", name: "washroom", widget: "boolean", default: false }
      - { label: "Display Front", name: "display_front", widget: "boolean", default: false }
      - { label: "Shutter Count", name: "shutter_count", widget: "number", value_type: "int", default: 1 }
      - { label: "Main Road Facing", name: "main_road_facing", widget: "boolean", default: false }
