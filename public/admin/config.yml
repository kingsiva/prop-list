# ============================================
# DECAP CMS CONFIGURATION
# Premier Properties — Property Listing Portal
# ============================================

backend:
  name: git-gateway
  branch: main

# Netlify Identity
logo_url: /favicon-32x32.png

# Media
media_folder: "src/assets/images/uploads"
public_folder: "/src/assets/images/uploads"

# Slug settings
slug:
  encoding: "ascii"
  clean_accents: true

# ============================================
# COMMON FIELD DEFINITIONS (YAML anchors)
# ============================================

# Base property fields shared by all types
_base_fields: &base_fields
  - { label: "Title", name: "title", widget: "string", hint: "Property listing title (e.g., 'Spacious 3BHK Villa in Anna Nagar')" }
  - { label: "Slug", name: "slug", widget: "string", hint: "URL-friendly identifier (auto-generated from title)" }
  - { label: "Property ID", name: "property_id", widget: "string", hint: "Unique property reference code" }
  - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Show on homepage featured section" }
  - label: "Status"
    name: "status"
    widget: "select"
    options:
      - { label: "Available", value: "available" }
      - { label: "Sold", value: "sold" }
      - { label: "Rented", value: "rented" }
      - { label: "Under Negotiation", value: "under_negotiation" }
    default: "available"
  - label: "Listing Type"
    name: "listing_type"
    widget: "select"
    options:
      - { label: "Buy", value: "buy" }
      - { label: "Rent", value: "rent" }
  - label: "Rental Type"
    name: "rental_type"
    widget: "select"
    options:
      - { label: "Daily", value: "daily" }
      - { label: "Weekly", value: "weekly" }
      - { label: "Monthly", value: "monthly" }
    required: false
    hint: "Only applicable if Listing Type is 'Rent'"
  - { label: "Price (₹)", name: "price", widget: "number", value_type: "int", min: 0 }
  - { label: "Location", name: "location", widget: "string", hint: "Area or locality name" }
  - { label: "Address", name: "address", widget: "string" }
  - { label: "City", name: "city", widget: "string" }
  - { label: "State", name: "state", widget: "string" }
  - { label: "Postal Code", name: "postal_code", widget: "string" }
  - { label: "Description", name: "description", widget: "text" }
  - { label: "Featured Image", name: "featured_image", widget: "image" }
  - label: "Gallery Images"
    name: "gallery_images"
    widget: "list"
    field: { label: "Image", name: "image", widget: "image" }
    required: false
  - { label: "Google Map URL", name: "google_map_url", widget: "string", required: false, hint: "Google Maps embed or link URL" }
  - { label: "Agent Name", name: "agent_name", widget: "string", default: "Rajesh Kumar" }
  - { label: "Agent Phone", name: "agent_phone", widget: "string", default: "+91 98765 43210" }
  - { label: "Agent Email", name: "agent_email", widget: "string", default: "rajesh@premierproperties.in" }
  - { label: "Published Date", name: "published_date", widget: "datetime" }
  - label: "Features"
    name: "features"
    widget: "select"
    multiple: true
    required: false
    options:
      - { label: "Near School", value: "near_school" }
      - { label: "Near Hospital", value: "near_hospital" }
      - { label: "Near Highway", value: "near_highway" }
      - { label: "Near Bus Stand", value: "near_bus_stand" }
      - { label: "Near Railway Station", value: "near_railway_station" }
      - { label: "Near Airport", value: "near_airport" }
      - { label: "Gated Community", value: "gated_community" }
      - { label: "Park Facing", value: "park_facing" }
      - { label: "Corner Property", value: "corner_property" }

