  # ---- SHOP ----
  - name: "shop"
    label: "🏪 Shops"
    folder: "src/content/properties"
    create: true
    slug: "{{slug}}"
    filter: { field: "property_type", value: "shop" }
    fields:
      - { label: "Property Type", name: "property_type", widget: "hidden", default: "shop" }
      - { label: "Title", name: "title", widget: "string", hint: "Property listing title (e.g., 'Spacious 3BHK Villa in Anna Nagar')" }
      - { label: "Slug", name: "slug", widget: "string", hint: "URL-friendly identifier (auto-generated from title)" }
      - { label: "Property ID", name: "property_id", widget: "string", hint: "Unique property reference code" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Show on homepage featured section" }
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Available", value: "available" }
          - { label: "Sold", value: "sold" }
          - { label: "Rented", value: "rented" }
          - { label: "Under Negotiation", value: "under_negotiation" }
        default: "available"
      - label: "Listing Type"
        name: "listing_type"
        widget: "select"
        options:
          - { label: "Buy", value: "buy" }
          - { label: "Rent", value: "rent" }
      - label: "Rental Type"
        name: "rental_type"
        widget: "select"
        options:
          - { label: "Daily", value: "daily" }
          - { label: "Weekly", value: "weekly" }
          - { label: "Monthly", value: "monthly" }
        required: false
        hint: "Only applicable if Listing Type is 'Rent'"
      - { label: "Price (₹)", name: "price", widget: "number", value_type: "int", min: 0 }
      - { label: "Location", name: "location", widget: "string", hint: "Area or locality name" }
      - { label: "Address", name: "address", widget: "string" }
      - { label: "City", name: "city", widget: "string" }
      - { label: "State", name: "state", widget: "string" }
      - { label: "Postal Code", name: "postal_code", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Featured Image", name: "featured_image", widget: "image" }
      - label: "Gallery Images"
        name: "gallery_images"
        widget: "list"
